<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#0E111A"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>
    <radialGradient id="glow-indigo" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#glow-indigo)"/>
  <rect width="1200" height="420" fill="url(#glow-emerald)"/>
  <rect width="1200" height="420" fill="url(#dot-grid)"/>

  <!-- Outer Stroke -->
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" rx="8"/>

  <!-- Top Pill / Status -->
  <g transform="translate(60, 50)">
    <rect width="210" height="28" rx="14" fill="#141724" stroke="url(#card-border)"/>
    <circle cx="16" cy="14" r="4" fill="#10B981"/>
    <circle cx="16" cy="14" r="7" fill="#10B981" fill-opacity="0.25"/>
    <text x="30" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">SYSTEMS INFRASTRUCTURE</text>
  </g>

  <!-- Main Name & Pitch -->
  <text x="60" y="132" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">Kirill Tsyganov</text>
  <text x="60" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="400" letter-spacing="-0.2">
    Building high-throughput in-memory databases, sub-millisecond vector indices &amp; realtime streaming engines.
  </text>

  <!-- 3 Pillar Stat Cards -->
  <!-- Card 1: Vector / Memory -->
  <g transform="translate(60, 220)">
    <rect width="335" height="145" rx="8" fill="#10131E" stroke="url(#card-border)"/>
    <rect x="0" y="0" width="3" height="145" fill="#4F46E5" rx="1.5"/>
    <text x="24" y="38" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1">VECTOR &amp; COLUMNAR</text>
    <text x="24" y="78" fill="#FFFFFF" font-family="'JetBrains Mono', 'Geist Mono', monospace" font-size="28" font-weight="700">&lt;0.6ms <tspan fill="#64748B" font-size="15" font-weight="400">P50</tspan></text>
    <text x="24" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">HNSW Skip-Graph &amp; SQ8 Quantization</text>
    <text x="24" y="124" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">99.1% Recall@10 · Zero-dependency</text>
  </g>

  <!-- Card 2: Voice Streaming -->
  <g transform="translate(432, 220)">
    <rect width="335" height="145" rx="8" fill="#10131E" stroke="url(#card-border)"/>
    <rect x="0" y="0" width="3" height="145" fill="#06B6D4" rx="1.5"/>
    <text x="24" y="38" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1">STREAMING VOICE AI</text>
    <text x="24" y="78" fill="#FFFFFF" font-family="'JetBrains Mono', 'Geist Mono', monospace" font-size="28" font-weight="700">235ms <tspan fill="#64748B" font-size="15" font-weight="400">E2E</tspan></text>
    <text x="24" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">Speculative Intent Prefetching</text>
    <text x="24" y="124" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">&lt;0.05ms Barge-in · 15ms De-click</text>
  </g>

  <!-- Card 3: Agent Security -->
  <g transform="translate(805, 220)">
    <rect width="335" height="145" rx="8" fill="#10131E" stroke="url(#card-border)"/>
    <rect x="0" y="0" width="3" height="145" fill="#10B981" rx="1.5"/>
    <text x="24" y="38" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1">AGENT SANDBOXING</text>
    <text x="24" y="78" fill="#FFFFFF" font-family="'JetBrains Mono', 'Geist Mono', monospace" font-size="28" font-weight="700">SHA-256 <tspan fill="#64748B" font-size="15" font-weight="400">CHAIN</tspan></text>
    <text x="24" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">AST Command Scanner &amp; Policy</text>
    <text x="24" y="124" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Dry-Run Sandbox · 10 Threat Rules</text>
  </g>
</svg>
